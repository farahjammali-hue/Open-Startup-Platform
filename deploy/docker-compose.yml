# Internal test deployment for platform-test.open-startup.org.
#
# Run from the REPO ROOT:
#
#   docker compose --env-file .env.test -f deploy/docker-compose.yml up -d --build
#
# Two containers on a private network: the app, and its own PostgreSQL.
#
# The database used to live inside the n8n Postgres container. That worked, but
# n8n's superuser could read every row of platform data (cap tables, KYS
# documents, founder details) and the two shared a container lifecycle. They are
# now fully separate and share nothing.
#
# Neither container publishes a database port, so Postgres is reachable only
# from this compose network: not from the internet, and not even from the host.

services:
  db:
    # Same major version as the data came from. Restoring a dump into an older
    # major fails, so do not lower this without re-testing the restore.
    image: postgres:16
    container_name: ost-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.test}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.test}
    volumes:
      - ost_platform_db:/var/lib/postgresql/data
    networks:
      - ost_internal
    # Deliberately no `ports:`. Adding one would expose the database to the
    # host and, depending on the bind address, to the internet. Reach it with
    # `docker exec ost-platform-db psql ...` instead.
    healthcheck:
      # $$ escapes for compose, so the container's own shell expands these.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ost-platform-test
    restart: unless-stopped
    env_file:
      - ../.env.test           # you create this from deploy/.env.test.example — never commit it
    environment:
      NODE_ENV: production
    depends_on:
      # Without this the app can start first, fail to connect, and restart-loop
      # until Postgres finishes initialising.
      db:
        condition: service_healthy
    ports:
      # Bound to 127.0.0.1 only, so the app is NOT reachable from the public
      # internet directly. CloudPanel's Nginx (on the host) reverse-proxies to
      # it. If you change this port, also update PORT in .env.test and the
      # CloudPanel reverse-proxy target.
      - "127.0.0.1:5100:5000"
    volumes:
      # Named volume so uploaded files (logos, decks, documents, signatures)
      # survive `docker compose down` and image rebuilds. Separate from any
      # volume used by other Docker services on this VPS.
      - ost_platform_test_uploads:/app/uploads
    networks:
      - ost_internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/auth/me', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ost_platform_test_uploads:
    name: ost_platform_test_uploads
  # Database files. Removing this volume destroys the database, so
  # `docker compose down -v` is not a safe way to restart things.
  ost_platform_db:
    name: ost_platform_db

networks:
  # Private to this deployment. Named explicitly so the one-off migration
  # containers can join it with a predictable `--network ost_platform_internal`.
  ost_internal:
    name: ost_platform_internal
