<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Startup Platform · The Science Road</title>

    <!-- Favicon. The SVG is just the brand emblem (not the globe+paper-plane
         mark below), and switches between the navy and off-white brand
         colours via prefers-color-scheme, so the tab icon reads correctly in
         both light and dark browser chrome. The PNG is a fallback for the
         few browsers without SVG favicon support, and covers the
         iOS/Android "add to home screen" icon, which needs a raster image
         regardless. -->
    <!-- ?v=N: bump whenever a file's content changes. Same URL with new
         bytes gets stuck behind browsers' own favicon cache — this makes it
         a distinct resource so a fresh visit doesn't show the old icon
         first. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" href="/ost-logo.png?v=2" />
    <link rel="apple-touch-icon" href="/ost-logo.png?v=2" />

    <meta name="description" content="Open Startup is a Pan-African startup acceleration platform focused on climate and health. We get startups ready for investment and the market." />
    <meta name="theme-color" content="#1d2853" />

    <!-- Open Graph: what a link to this site looks like when shared on
         Slack, WhatsApp, LinkedIn, etc. og:image needs an absolute URL —
         relative paths are silently ignored by most of these platforms.
         og-image.png is the brand emblem composited onto a solid navy
         1200x630 card (built from the official off-white icon asset) rather
         than the transparent source PNG, so it renders identically
         regardless of the viewer's own light/dark theme. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open Startup Platform" />
    <meta property="og:title" content="Open Startup Platform · The Science Road" />
    <meta property="og:description" content="Open Startup is a Pan-African startup acceleration platform focused on climate and health. We get startups ready for investment and the market." />
    <meta property="og:image" content="https://platform.open-startup.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://platform.open-startup.org/" />

    <!-- Twitter/X card: falls back to the og: tags above for anything not
         repeated here, but summary_large_image needs its own card type set. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Open Startup Platform · The Science Road" />
    <meta name="twitter:description" content="Open Startup is a Pan-African startup acceleration platform focused on climate and health. We get startups ready for investment and the market." />
    <meta name="twitter:image" content="https://platform.open-startup.org/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Inter: the brand-tokens UI face. No self-hosted files were provided with the brand kit yet, so this loads from Google Fonts like Hanken Grotesk above. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
