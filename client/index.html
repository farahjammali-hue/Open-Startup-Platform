<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Startup Platform · The Science Road</title>

    <!-- Favicon. One source PNG covers browser tabs, bookmarks, and the
         iOS/Android "add to home screen" icon — no separate .ico needed for
         any browser still in real use. -->
    <link rel="icon" type="image/png" href="/ost-logo.png" />
    <link rel="apple-touch-icon" href="/ost-logo.png" />

    <meta name="description" content="Open Startup's all-in-one program management platform — startup onboarding, mentorship, training, KPI reporting, data rooms, and an admin console, all in one place." />
    <meta name="theme-color" content="#1d2853" />

    <!-- Open Graph: what a link to this site looks like when shared on
         Slack, WhatsApp, LinkedIn, etc. og:image needs an absolute URL —
         relative paths are silently ignored by most of these platforms. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open Startup Platform" />
    <meta property="og:title" content="Open Startup Platform · The Science Road" />
    <meta property="og:description" content="Open Startup's all-in-one program management platform — startup onboarding, mentorship, training, KPI reporting, data rooms, and an admin console, all in one place." />
    <meta property="og:image" content="https://platform.open-startup.org/ost-logo.png" />
    <meta property="og:url" content="https://platform.open-startup.org/" />

    <!-- Twitter/X card: falls back to the og: tags above for anything not
         repeated here, but summary_large_image needs its own card type set. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Open Startup Platform · The Science Road" />
    <meta name="twitter:description" content="Open Startup's all-in-one program management platform — startup onboarding, mentorship, training, KPI reporting, data rooms, and an admin console, all in one place." />
    <meta name="twitter:image" content="https://platform.open-startup.org/ost-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Inter: the brand-tokens UI face. No self-hosted files were provided with the brand kit yet, so this loads from Google Fonts like Hanken Grotesk above. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
